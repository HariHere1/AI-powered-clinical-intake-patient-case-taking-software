services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  stt:
    build: ./python-services/stt
    restart: unless-stopped
    environment:
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
    ports:
      - "8001:8001"

  tts:
    build: ./python-services/tts
    restart: unless-stopped
    ports:
      - "8002:8002"
    # GPU passthrough (NVIDIA Container Toolkit + WSL2 GPU support on Windows)
    # is documented in docker-compose.override.yml.example. Without it this
    # service still runs, but generation is CPU-bound and slow.

  ocr:
    build: ./python-services/ocr
    restart: unless-stopped
    ports:
      - "8003:8003"

volumes:
  pgdata:
